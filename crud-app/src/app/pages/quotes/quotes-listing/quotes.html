<meta name="viewport" content="width=device-width, initial-scale=1">

<div class="text-center py-5 rounded-2">
  <h1>Quotes</h1>
  <div>
    <div>Add new Quote   <a class="btn btn-primary" [routerLink]="['create']" role="button">Add</a></div>
  </div>
</div>

<div class="container">
  <div class="row mt-5 w-50">

    <div class="container list">
      @if (quote$ | async;as quotes) {
        @if (quotes.length > 0){
          <ul class="list-group">
          @for (item of quotes; track $index){
            <li class="list-group-item d-flex justify-content-between-align-items-start mb-2 border px-4 py-3 rounded-3"> 
              <div class="flex-grow-1">
                <div class="fw-bold">"{{item.text}}"</div>
                <div >{{item.origin}}</div>
              </div>
              <span class="text-secondary">
                <i [routerLink]="['update', item.id]" class="fa-solid fa-pen mouse-hover" data-toggle="tooltip" data-placement="top" title="Quote"></i>
              </span>  
              <span class="text-secondary" data-toggle="tooltip" data-placement="top" title="Delete Quote">
                  <i class="fa-solid fa-trash mouse-hover" (click)="openModalFunction(myModalContent)"></i> 
                  <ng-template #myModalContent let-modal>

                      <div class="modal-header">
                          Delete Quote
                      </div>

                      <div class="modal-body">
                        Are you sure you want to delete this Quote?
                      </div>

                      <div class="modal-footer">
                          <a class="btn btn-secondary" (click)="modal.close()" role="button">Close</a>
                          <button type="button" class="btn btn-danger" (click)="deleteQuote(item.id)">Delete</button>
                      </div>

                  </ng-template>
                </span>
            </li>
          }
          </ul>

        } @else {
          <p>No Quotes Found...</p>
        }
      }
    </div>
